<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="How I build retrieval-augmented generation systems">
<title>How I build retrieval-augmented generation systems</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a1a"/><stop offset="1" stop-color="#0f0b26"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".05"/></pattern>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace}
.sans{font-family:'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
.it{opacity:0;animation:in .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.flow{stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
</style>
</defs>
<rect width="1200" height="470" rx="20" fill="url(#bg)"/><rect width="1200" height="470" rx="20" fill="url(#grid)"/>
<text class="mono" x="44" y="52" fill="#7dd3fc" font-size="17" letter-spacing="3">RAG · HOW I BUILD IT</text>
<text class="mono" x="1156" y="52" fill="#64748b" font-size="15" text-anchor="end">grounded, measured, iterated</text>
<path d="M294,147.0 H328" stroke="#1e293b" stroke-width="3" fill="none"/>
<path class="flow" d="M294,147.0 H328" stroke="#7dd3fc" stroke-opacity=".8" stroke-width="3" fill="none"/>
<path d="M578,147.0 H612" stroke="#1e293b" stroke-width="3" fill="none"/>
<path class="flow" d="M578,147.0 H612" stroke="#60a5fa" stroke-opacity=".8" stroke-width="3" fill="none"/>
<path d="M862,147.0 H896" stroke="#1e293b" stroke-width="3" fill="none"/>
<path class="flow" d="M862,147.0 H896" stroke="#818cf8" stroke-opacity=".8" stroke-width="3" fill="none"/>
<path d="M1021.0,202 V300" stroke="#1e293b" stroke-width="3" fill="none"/>
<path class="flow" d="M1021.0,202 V300" stroke="#a78bfa" stroke-opacity=".8" stroke-width="3" fill="none"/>
<path d="M896,355.0 H862" stroke="#1e293b" stroke-width="3" fill="none"/>
<path class="flow" d="M896,355.0 H862" stroke="#c4b5fd" stroke-opacity=".8" stroke-width="3" fill="none"/>
<path d="M612,355.0 H578" stroke="#1e293b" stroke-width="3" fill="none"/>
<path class="flow" d="M612,355.0 H578" stroke="#f472b6" stroke-opacity=".8" stroke-width="3" fill="none"/>
<circle r="5.5" fill="#e0f2fe" filter="url(#glow)"><animateMotion dur="7s" begin="0.00s" repeatCount="indefinite" path="M294,147.0 H328 M578,147.0 H612 M862,147.0 H896 M1021.0,202 V300 M896,355.0 H862 M612,355.0 H578"/></circle>
<circle r="5.5" fill="#e0f2fe" filter="url(#glow)"><animateMotion dur="7s" begin="2.33s" repeatCount="indefinite" path="M294,147.0 H328 M578,147.0 H612 M862,147.0 H896 M1021.0,202 V300 M896,355.0 H862 M612,355.0 H578"/></circle>
<circle r="5.5" fill="#e0f2fe" filter="url(#glow)"><animateMotion dur="7s" begin="4.66s" repeatCount="indefinite" path="M294,147.0 H328 M578,147.0 H612 M862,147.0 H896 M1021.0,202 V300 M896,355.0 H862 M612,355.0 H578"/></circle>
<path class="flow" d="M328,355.0 H294" stroke="#34d399" stroke-opacity=".6" stroke-width="2.5" fill="none"/>
<path class="flow" d="M169.0,300 V251 H453.0 V202" stroke="#34d399" stroke-opacity=".6" stroke-width="2.5" fill="none"/>
<g class="it" style="animation-delay:1.3s"><rect x="44" y="300" width="250" height="110" rx="16" fill="#34d399" fill-opacity=".06" stroke="#34d399" stroke-opacity=".5" stroke-dasharray="5 5"/>
<text class="mono" x="64" y="332" fill="#34d399" font-size="15" font-weight="700" letter-spacing="1">LOOP</text>
<text class="sans" x="64" y="364" fill="#f1f5f9" font-size="22" font-weight="700">Tune &amp; repeat</text>
<text class="sans" x="64" y="390" fill="#94a3b8" font-size="15">evals reshape chunks, recall, prompts</text></g>
<g class="it" style="animation-delay:0.15s">
<rect x="44" y="92" width="250" height="110" rx="16" fill="#0f172a" stroke="#7dd3fc" stroke-opacity=".55" stroke-width="1.5"/>
<text class="mono" x="64" y="124" fill="#7dd3fc" font-size="15" font-weight="700" letter-spacing="1">01</text>
<text class="sans" x="64" y="156" fill="#f1f5f9" font-size="22" font-weight="700">Ingest</text>
<text class="sans" x="64" y="182" fill="#94a3b8" font-size="15">PDFs · docs · audio · DBs</text>
</g>
<g class="it" style="animation-delay:0.30s">
<rect x="328" y="92" width="250" height="110" rx="16" fill="#0f172a" stroke="#60a5fa" stroke-opacity=".55" stroke-width="1.5"/>
<text class="mono" x="348" y="124" fill="#60a5fa" font-size="15" font-weight="700" letter-spacing="1">02</text>
<text class="sans" x="348" y="156" fill="#f1f5f9" font-size="22" font-weight="700">Chunk &amp; enrich</text>
<text class="sans" x="348" y="182" fill="#94a3b8" font-size="15">structure-aware splits, metadata</text>
</g>
<g class="it" style="animation-delay:0.45s">
<rect x="612" y="92" width="250" height="110" rx="16" fill="#0f172a" stroke="#818cf8" stroke-opacity=".55" stroke-width="1.5"/>
<text class="mono" x="632" y="124" fill="#818cf8" font-size="15" font-weight="700" letter-spacing="1">03</text>
<text class="sans" x="632" y="156" fill="#f1f5f9" font-size="22" font-weight="700">Index</text>
<text class="sans" x="632" y="182" fill="#94a3b8" font-size="15">dense embeddings + BM25</text>
</g>
<g class="it" style="animation-delay:0.60s">
<rect x="896" y="92" width="250" height="110" rx="16" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".55" stroke-width="1.5"/>
<text class="mono" x="916" y="124" fill="#a78bfa" font-size="15" font-weight="700" letter-spacing="1">04</text>
<text class="sans" x="916" y="156" fill="#f1f5f9" font-size="22" font-weight="700">Hybrid retrieve</text>
<text class="sans" x="916" y="182" fill="#94a3b8" font-size="15">semantic + lexical fusion</text>
</g>
<g class="it" style="animation-delay:0.75s">
<rect x="896" y="300" width="250" height="110" rx="16" fill="#0f172a" stroke="#c4b5fd" stroke-opacity=".55" stroke-width="1.5"/>
<text class="mono" x="916" y="332" fill="#c4b5fd" font-size="15" font-weight="700" letter-spacing="1">05</text>
<text class="sans" x="916" y="364" fill="#f1f5f9" font-size="22" font-weight="700">Rerank</text>
<text class="sans" x="916" y="390" fill="#94a3b8" font-size="15">cross-encoder precision</text>
</g>
<g class="it" style="animation-delay:0.90s">
<rect x="612" y="300" width="250" height="110" rx="16" fill="#0f172a" stroke="#f472b6" stroke-opacity=".55" stroke-width="1.5"/>
<text class="mono" x="632" y="332" fill="#f472b6" font-size="15" font-weight="700" letter-spacing="1">06</text>
<text class="sans" x="632" y="364" fill="#f1f5f9" font-size="22" font-weight="700">Ground &amp; generate</text>
<text class="sans" x="632" y="390" fill="#94a3b8" font-size="15">cited, context-bounded LLM</text>
</g>
<g class="it" style="animation-delay:1.05s">
<rect x="328" y="300" width="250" height="110" rx="16" fill="#0f172a" stroke="#34d399" stroke-opacity=".55" stroke-width="1.5"/>
<text class="mono" x="348" y="332" fill="#34d399" font-size="15" font-weight="700" letter-spacing="1">07</text>
<text class="sans" x="348" y="364" fill="#f1f5f9" font-size="22" font-weight="700">Evaluate</text>
<text class="sans" x="348" y="390" fill="#94a3b8" font-size="15">recall@k · faithfulness · drift</text>
</g>
<rect x=".75" y=".75" width="1198.5" height="468.5" rx="19.5" fill="none" stroke="#7dd3fc" stroke-opacity=".15" stroke-width="1.5"/>
</svg>
