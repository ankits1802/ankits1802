<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Ankit Kumar — AI Systems Engineer and Researcher">
  <title>Ankit Kumar — AI Systems Engineer &amp; Researcher</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0a1229"/>
      <stop offset="1" stop-color="#120a2a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.35" stop-color="#7dd3fc"/>
      <stop offset="0.65" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#e0f2fe"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="430" rx="22"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
      .blob{animation:drift 18s ease-in-out infinite alternate}
      .b2{animation-duration:23s;animation-delay:-6s}
      .b3{animation-duration:29s;animation-delay:-12s}
      @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-30px) scale(1.15)}100%{transform:translate(-40px,25px) scale(.95)}}
      .node{animation:pulse 3.2s ease-in-out infinite}
      .n2{animation-delay:-.8s}.n3{animation-delay:-1.6s}.n4{animation-delay:-2.4s}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      .edge{stroke-dasharray:6 10;animation:flow 2.4s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-32}}
      .fade{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
      .d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}.d4{animation-delay:.75s}.d5{animation-delay:.95s}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      .caret{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .live{animation:live 2s ease-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes live{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <rect width="1200" height="430" fill="url(#grid)"/>
    <g filter="url(#blur)" opacity="0.55">
      <circle class="blob" cx="980" cy="90" r="170" fill="#7c3aed"/>
      <circle class="blob b2" cx="760" cy="380" r="150" fill="#0891b2"/>
      <circle class="blob b3" cx="140" cy="40" r="120" fill="#1d4ed8"/>
    </g>

    <!-- neural constellation -->
    <g transform="translate(790 70)" stroke-linecap="round">
      <g stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="1.4" fill="none">
        <path class="edge" d="M20 40L150 20M20 40L150 120M20 140L150 20M20 140L150 120M20 140L150 220M20 240L150 120M20 240L150 220"/>
        <path class="edge" d="M150 20L280 70M150 120L280 70M150 120L280 170M150 220L280 170M150 20L280 170M150 220L280 70" stroke="#c4b5fd" stroke-opacity="0.35"/>
        <path class="edge" d="M280 70L370 120M280 170L370 120" stroke="#fbbf24" stroke-opacity="0.45"/>
      </g>
      <g fill="#7dd3fc" filter="url(#glow)">
        <circle class="node" cx="20" cy="40" r="5"/>
        <circle class="node n2" cx="20" cy="140" r="5"/>
        <circle class="node n3" cx="20" cy="240" r="5"/>
        <circle class="node n2" cx="150" cy="20" r="6" fill="#a5b4fc"/>
        <circle class="node n4" cx="150" cy="120" r="6" fill="#a5b4fc"/>
        <circle class="node n3" cx="150" cy="220" r="6" fill="#a5b4fc"/>
        <circle class="node" cx="280" cy="70" r="6" fill="#c4b5fd"/>
        <circle class="node n4" cx="280" cy="170" r="6" fill="#c4b5fd"/>
        <circle cx="370" cy="120" r="9" fill="#fbbf24"/>
      </g>
      <text class="mono" x="370" y="152" fill="#fbbf24" fill-opacity="0.85" font-size="11" text-anchor="middle">output</text>
      <text class="mono" x="20" y="275" fill="#7dd3fc" fill-opacity="0.6" font-size="11" text-anchor="middle">context</text>
    </g>

    <!-- copy -->
    <g transform="translate(70 0)">
      <text class="mono fade d1" x="0" y="92" fill="#7dd3fc" font-size="18" letter-spacing="1.5">~/ankits1802 <tspan fill="#64748b">$</tspan> whoami<tspan class="caret" fill="#7dd3fc">▍</tspan></text>
      <text class="sans fade d2" x="-4" y="178" fill="url(#name)" font-size="84" font-weight="800" letter-spacing="-2.5">Ankit Kumar</text>
      <text class="sans fade d3" x="0" y="222" fill="#cbd5e1" font-size="28" font-weight="500">AI Systems Engineer <tspan fill="#475569">·</tspan> Researcher <tspan fill="#475569">·</tspan> Builder</text>
      <text class="sans fade d3" x="0" y="256" fill="#94a3b8" font-size="20" font-style="italic">Full-time Thinker. Part-time Tinkerer.</text>
      <rect class="fade d4" x="0" y="282" width="560" height="1.5" fill="url(#rule)"/>

      <g class="fade d5 sans" font-size="17" font-weight="600">
        <g transform="translate(0 306)">
          <rect width="306" height="40" rx="20" fill="#0e7490" fill-opacity="0.22" stroke="#22d3ee" stroke-opacity="0.5"/>
          <circle class="live" cx="20" cy="20" r="5" fill="#34d399"/>
          <circle cx="20" cy="20" r="5" fill="#34d399"/>
          <text x="36" y="26" fill="#e0f2fe">Senior AI Engineer · Skai Lama</text>
        </g>
        <g transform="translate(320 306)">
          <rect width="350" height="40" rx="20" fill="#6d28d9" fill-opacity="0.22" stroke="#a78bfa" stroke-opacity="0.55"/>
          <circle class="live" cx="20" cy="20" r="5" fill="#34d399"/>
          <circle cx="20" cy="20" r="5" fill="#34d399"/>
          <text x="36" y="26" fill="#ede9fe">Researcher · AI CoE, IIT Kharagpur</text>
        </g>
      </g>
      <text class="mono fade d5" x="0" y="392" fill="#7c8aa5" font-size="16">Bengaluru, India · agentic AI · RAG · LLM systems · trustworthy inference</text>
    </g>
    <rect x="0.75" y="0.75" width="1198.5" height="428.5" rx="21.5" fill="none" stroke="#7dd3fc" stroke-opacity="0.18" stroke-width="1.5"/>
  </g>
</svg>
