<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="644" viewBox="0 0 1200 644" role="img" aria-label="Full-stack AI, from silicon to product">
<title>Full-stack AI, from silicon to product</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a1a"/><stop offset="1" stop-color="#0f0b26"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".05"/></pattern>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace}
.sans{font-family:'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
.it{opacity:0;animation:in .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.flow{stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
</style>
</defs>
<rect width="1200" height="644" rx="20" fill="url(#bg)"/><rect width="1200" height="644" rx="20" fill="url(#grid)"/>
<text class="mono" x="44" y="52" fill="#7dd3fc" font-size="17" letter-spacing="3">SILICON → PRODUCT</text>
<text class="mono" x="1156" y="52" fill="#64748b" font-size="15" text-anchor="end">one engineer, every layer</text>
<line x1="300" y1="96" x2="300" y2="590" stroke="#1e293b" stroke-width="3"/>
<line class="flow" x1="300" y1="590" x2="300" y2="96" stroke="#7dd3fc" stroke-opacity=".7" stroke-width="3"/>
<circle r="6" fill="#e0f2fe" filter="url(#glow)"><animateMotion dur="4.5s" repeatCount="indefinite" path="M300,590 V96"/></circle>
