<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Career journey of Ankit Kumar">
<title>Journey: electronics diploma to senior AI engineer and researcher</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a1a"/><stop offset="1" stop-color="#0f0b26"/></linearGradient>
<linearGradient id="track" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="1090" y2="0"><stop offset="0" stop-color="#475569"/><stop offset=".45" stop-color="#38bdf8"/><stop offset=".78" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399"/></linearGradient>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".05"/></pattern>
<style>
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace}
.sans{font-family:'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
.it{opacity:0;animation:in .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 2.4s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ring{animation:ring 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
</style>
</defs>
<rect width="1200" height="440" rx="20" fill="url(#bg)"/>
<rect width="1200" height="440" rx="20" fill="url(#grid)"/>
