name: Contribution snake

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#c4b5fd&color_dots=#161b22,#0c4a6e,#0369a1,#0ea5e9,#7dd3fc
            dist/snake-light.svg?palette=github-light&color_snake=#7c3aed&color_dots=#ebedf0,#bae6fd,#38bdf8,#0284c7,#075985
      - name: Commit snake into assets
        run: |
          cp dist/snake.svg dist/snake-light.svg assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg assets/snake-light.svg
          git diff --cached --quiet || (git commit -m "chore: refresh contribution snake" && git pull --rebase && git push)
